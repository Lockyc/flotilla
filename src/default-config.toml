# flotilla config — app-wide settings, then your windows. Edit and save; flotilla hot-reloads.

# Chrome sizing: "comfortable" or "compact".
density = "comfortable"

# Force a dark appearance so pages honouring prefers-color-scheme render dark.
dark_mode = false

# What ⌘1 and ⌘2 do: "jump" — ⌘1–⌘9 go to that tab; "cycle" — ⌘1 next tab, ⌘2 previous,
# ⌘3–⌘9 go to that tab.
tab_digit_keys = "jump"

# Check for a new release on launch and every 6 hours.
auto_update = true

# Hosts whose self-signed or invalid TLS certificate is accepted. Read at launch.
allow_insecure = []

# Reformat this file in house style on each clean reload.
format_on_save = false

# Windows, each holding groups of documents. flotilla writes these as you work; a hand edit
# sticks. A document is open once across every window.
[[window]]
title = "flotilla"

# Another window, with every key a window, its groups and their documents take:
#
# [[window]]
# title = "Club"              # the window's name: sidebar banner, window title, Window menu
# colour = "#2a6f4e"          # optional accent, "#rgb" or "#rrggbb"
# width = 1500                # optional size of its first open
# height = 1000
# open_on_start = true        # optional; false leaves it closed until opened from the Window menu
#
# [[window.group]]
# name = "Club drive"         # the group's name in the sidebar
# url = "https://drive.google.com/drive/folders/0AbCdEfGhIjKlMnOpQ"  # its head and Home
# store = "default"           # optional login store; another store is another account
# collapsed = false           # optional; true shows the head alone
# detached = false            # optional; true reopens the head in its own window
#
# [[window.group.tab]]
# title = "Budget"            # the document's name in the sidebar
# url = "https://docs.google.com/spreadsheets/d/1AbCdEfGhIjKlMnOpQrSt04/edit"
# detached = false            # optional; true reopens it in its own window
