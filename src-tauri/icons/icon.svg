<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <!-- Edge-to-edge tile: `plate icon` places it in Apple's icon grid (824 of 1024 px). -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- the fleet: a smaller ship to each side of the flagship -->
  <g fill="#ffffff" opacity="0.55">
    <path d="M158 600 L158 420 L238 600 Z"/>
    <path d="M110 632 H246 L222 684 H134 Z"/>
    <path d="M866 600 L866 420 L786 600 Z"/>
    <path d="M778 632 H914 L890 684 H802 Z"/>
  </g>

  <!-- the flagship: pennant, mast, two sails, hull -->
  <g fill="#ffffff">
    <path d="M512 190 L592 230 L512 270 Z"/>
    <rect x="502" y="190" width="20" height="500"/>
    <path d="M488 290 L488 650 L316 650 Z"/>
    <path d="M536 340 L536 650 L692 650 Z"/>
    <path d="M272 690 H752 L696 796 H328 Z"/>
  </g>
</svg>
