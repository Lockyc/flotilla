[package]
name = "flotilla-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
url = "2"
shell-core = { git = "https://github.com/Lockyc/shell-core", rev = "4fac1995d8b364c715883ca3fb6096636b1c9ce9", default-features = false }
config-core = { git = "https://github.com/Lockyc/config-core", rev = "37df5f286f4f10a6f3da661563d89a53420e8dc7" }

[dev-dependencies]
proptest = "=1.12.0"
proptest-state-machine = "=0.9.0"
tempfile = "3"
