# flotilla config — app-wide settings. Edit and save; flotilla hot-reloads.

# The window's name, shown in the sidebar and the Window menu. Empty for none.
title = ""

# The window's accent colour, "#rgb" or "#rrggbb". Empty for neutral.
colour = ""

# Chrome sizing: "comfortable" or "compact".
density = "comfortable"

# Force a dark appearance so pages honouring prefers-color-scheme render dark.
dark_mode = false

# What ⌘1 and ⌘2 do: "jump" — ⌘1–⌘9 go to that tab; "cycle" — ⌘1 next tab, ⌘2 previous,
# ⌘3–⌘9 go to that tab.
tab_digit_keys = "jump"

# Check for a new release on launch and every 6 hours.
auto_update = true

# Hosts whose self-signed or invalid TLS certificate is accepted. Read at launch.
allow_insecure = []

# Reformat this file in house style on each clean reload.
format_on_save = false
