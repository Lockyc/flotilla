[package]
name = "flotilla"
version = "0.2.0"
edition = "2021"
description = "A workspace where any tab can head a group of documents, each opened once, restored on relaunch. macOS only."
license = "MIT"
repository = "https://github.com/Lockyc/flotilla"
readme = "../README.md"
publish = false

[lib]
name = "flotilla_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# The shared sidebar chrome, embedded as string consts; build.rs writes them into ../src (the
# frontendDist Tauri embeds). Pinned by rev — bump in lockstep with the toolchain.
chrome-core = { git = "https://github.com/Lockyc/chrome-core", rev = "231686ff1a365c0ffc8bbf0cc2b035d1e4ffe38f" }
# Shared release tooling + build_stamp. build.rs materializes scripts/*.sh (git-ignored) and stamps
# BUILD_GIT_SHA/BUILD_DATE. default-features=false keeps the build-dep zero-tauri (resolver 2 keeps
# it separate from the runtime-featured [dependencies] entry below). Pinned by rev.
shell-core = { git = "https://github.com/Lockyc/shell-core", rev = "a0af24a830258419d7dfa2c22a32c90aa8761bbb", default-features = false }

[dependencies]
tauri = { version = "2", features = ["unstable", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# updater/process are kept explicit so their capability permissions resolve; plugin *registration*
# flows through shell_core::register_plugins (runtime feature).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Same rev as the build-dep above — bump both in lockstep.
shell-core = { git = "https://github.com/Lockyc/shell-core", rev = "a0af24a830258419d7dfa2c22a32c90aa8761bbb", features = ["runtime"] }
flotilla-core = { path = "../crates/flotilla-core" }
dirs = "5"
toml = "0.8"
# House-style formatter, starter-config seeding and path resolution, shared with curator, warden and lector. Pinned by rev, same as curator.
config-core = { git = "https://github.com/Lockyc/config-core", rev = "bb2939bb9b5e46a2ef57566b52149dcc0aa598b6" }
url = "2"
# Google Drive access (OAuth + REST). reqwest keeps the rustls backend the updater already resolves.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
security-framework = "3"
sha2 = "0.10"
base64 = "0.23"
getrandom = "0.4"
# reqwest's rustls-no-provider leaves the crypto provider to the app: `google::http` installs ring, as the updater does.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
tempfile = "3"

# The chrome-core / shell-core [patch] local-dev overrides live in the workspace-root Cargo.toml
# (../Cargo.toml) — a [patch] must sit in the workspace root, not a member manifest.
